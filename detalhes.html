<!DOCTYPE html>
<!-- CAVERNA: pedra 2. Detalhe do bicho (RF003) e botao de favoritar (RF004).
     Qual bicho aparece? O numero que vier no endereco: detalhes.html?id=4 -->
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Detalhes do Pokémon</title>
</head>
<body>

  <header>
    <a href="index.html">&#9664; Voltar</a>
    <h1>Detalhes do Pokémon</h1>
  </header>

  <hr>

  <main>

    <!-- CAVERNA: esperando o mensageiro. -->
    <p id="estado-carregando">Carregando…</p>

    <!-- CAVERNA: RF007 de novo. Numero errado tambem cai aqui. -->
    <section id="estado-erro" hidden>
      <h2>Deu ruim</h2>
      <p id="mensagem-erro">Não foi possível carregar este Pokémon.</p>
      <button type="button" id="btn-tentar">Tentar novamente</button>
    </section>

    <!-- ================= O BICHO ================= -->
    <!-- CAVERNA: casca vazia. JS enche com dado da PokeAPI. -->
    <div id="conteudo" hidden>

      <figure>
        <img id="poke-imagem" src="" alt="" width="200" height="200">
        <figcaption>
          <strong id="poke-numero"></strong>
          <span id="poke-nome"></span>
        </figcaption>
      </figure>

      <!-- CAVERNA: mesmo botao poe e tira (RF004). Texto muda sozinho. -->
      <button type="button" id="btn-favorito" aria-pressed="false">☆ Adicionar aos favoritos</button>

      <hr>

      <!-- CAVERNA: tipo em portugues (RNF005). -->
      <section>
        <h2>Tipos</h2>
        <ul id="poke-tipos"></ul>
      </section>

      <section>
        <h2>Habilidades</h2>
        <ul id="poke-habilidades"></ul>
      </section>

      <hr>

      <!-- ================= SEIS ATRIBUTOS (RF003) ================= -->
      <section>
        <h2>Atributos</h2>
        <table>
          <thead>
            <tr>
              <th scope="col">Atributo</th>
              <th scope="col">Valor</th>
              <th scope="col">Barra</th>
            </tr>
          </thead>
          <!-- CAVERNA: as seis linhas nascem no JS. -->
          <tbody id="poke-atributos"></tbody>
        </table>
      </section>

    </div>

  </main>

  <hr>
  <footer>
    <p>PokéLista &mdash; Projeto 01 &mdash; dados da <a href="https://pokeapi.co/" target="_blank" rel="noopener">PokéAPI</a></p>
  </footer>

  <script src="js/traducoes.js"></script>
  <script src="js/api.js"></script>
  <script src="js/favoritos.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pagina-detalhes.js"></script>
</body>
</html>
